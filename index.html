<style>
/* Layout: phone-first single column on a candy-pink sparkle ground; sticky chips on top, thumb dock at the bottom, kitten mascot pops up from the dock after every answer */
:root{
  --bg:#ffe9f2; --bg2:#ffd9e8; --card:#fffafc; --ink:#4a2a3c; --muted:#9a6a84; --line:#f6c3d8;
  --pink:#ff5c9a; --pink-deep:#e23d80; --pink-soft:#ffe1ee; --mint:#2fb889; --mint-soft:#dcf7ec; --berry:#e0457b; --berry-soft:#ffe3ea;
  --lav:#b48cff; --gold:#ffc94d; --on-pink:#ffffff;
  --f-th:"Mali",system-ui,-apple-system,sans-serif;
  --f-zh:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --f-cute:"ZCOOL KuaiLe","Mali",sans-serif;
  --barh:66px; color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;scroll-padding-top:140px}
body{margin:0;color:var(--ink);font-family:var(--f-th);font-size:16px;line-height:1.6;background-color:var(--bg);
  background-image:
    radial-gradient(circle at 12% 8%,rgba(255,255,255,.9) 0 2px,transparent 3px),
    radial-gradient(circle at 78% 14%,rgba(255,255,255,.9) 0 1.5px,transparent 2.5px),
    radial-gradient(circle at 40% 30%,rgba(255,201,77,.55) 0 1.5px,transparent 2.5px),
    radial-gradient(circle at 90% 46%,rgba(180,140,255,.45) 0 2px,transparent 3px),
    radial-gradient(circle at 6% 62%,rgba(255,255,255,.95) 0 2px,transparent 3px),
    radial-gradient(circle at 60% 80%,rgba(255,92,154,.3) 0 2px,transparent 3px),
    linear-gradient(180deg,var(--bg2),var(--bg) 320px);
  background-size:220px 220px,260px 260px,180px 180px,300px 300px,240px 240px,280px 280px,100% 100%;
  background-attachment:fixed}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:760px;margin:0 auto}
.sparkles{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.sparkles i{position:absolute;color:#fff;font-style:normal;font-size:14px;opacity:.85;text-shadow:0 0 6px rgba(255,92,154,.6)}
header.top{position:relative;z-index:1;padding-top:calc(18px + env(safe-area-inset-top,0px));padding-bottom:10px;display:flex;gap:12px;align-items:center}
header.top svg{flex:0 0 78px;width:78px;height:78px}
.hgroup{display:grid;gap:2px;min-width:0}
.eyebrow{font-size:12.5px;color:var(--pink-deep);font-weight:600;letter-spacing:.03em}
h1{font-family:var(--f-cute);font-weight:400;font-size:clamp(23px,6.4vw,32px);line-height:1.25;margin:0;color:var(--pink-deep);text-shadow:2px 2px 0 #fff}
.lede{color:var(--muted);margin:0;font-size:14px}
nav.bar{position:sticky;top:0;z-index:5;background:rgba(255,233,242,.92);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);padding-top:env(safe-area-inset-top,0px);border-bottom:2px dotted var(--line)}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-block:10px 8px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:14px;font-weight:500;min-height:38px;padding:0 13px;border-radius:999px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px}
.tab small{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px}
.tab[aria-selected="true"]{background:var(--pink);border-color:var(--pink);color:var(--on-pink);box-shadow:0 3px 0 var(--pink-deep)}
.tab[aria-selected="true"] small{color:inherit;opacity:.9}
.prog{height:8px;background:#fff;border:2px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:8px}
.prog i{display:block;height:100%;width:0;background:repeating-linear-gradient(-45deg,var(--pink) 0 8px,#ff8cb8 8px 16px);transition:width .3s}
.filters{display:flex;gap:6px;padding-bottom:10px}
.fbtn{font:inherit;font-size:13px;border:2px solid var(--line);background:transparent;color:var(--muted);min-height:32px;padding:0 11px;border-radius:999px;cursor:pointer}
.fbtn[aria-pressed="true"]{color:var(--pink-deep);border-color:var(--pink);background:var(--card)}
button:focus-visible{outline:3px solid var(--lav);outline-offset:2px}
main{position:relative;z-index:1;padding-top:14px;padding-bottom:calc(var(--barh) + 28px + env(safe-area-inset-bottom,0px))}
.sechead{display:grid;gap:2px;margin-bottom:12px}
.sechead h2{font-size:18px;margin:0;line-height:1.4;color:var(--pink-deep)}
.sechead p{margin:0;color:var(--muted);font-size:14px}
ol.qs{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.q{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:14px;display:grid;gap:10px;min-width:0;box-shadow:0 4px 0 #f9cfe0}
.qtop{display:flex;gap:8px;align-items:baseline}
.qn{font-variant-numeric:tabular-nums;font-weight:700;color:var(--on-pink);background:var(--pink);border-radius:999px;padding:0 9px;font-size:14px;flex:0 0 auto;line-height:1.7}
.qtext{min-width:0;font-size:15.5px}
.zhline{font-family:var(--f-zh);font-size:21px;line-height:1.5;margin-top:4px;word-break:break-all}
.pyline{color:var(--muted);font-size:14.5px;font-style:italic}
.chunks{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chunk{border:2px dashed #f4a6c6;background:#fff;border-radius:12px;padding:4px 10px;display:grid;justify-items:center;min-width:52px}
.chunk .n{font-size:11.5px;color:var(--pink-deep);font-weight:700}
.chunk .z{font-family:var(--f-zh);font-size:18px;line-height:1.35}
.chunk .p{font-size:12px;color:var(--muted);font-style:italic}
.opts{display:grid;grid-template-columns:1fr;gap:8px}
@media (min-width:600px){.opts{grid-template-columns:1fr 1fr}}
.opt{display:flex;gap:10px;align-items:center;text-align:left;font:inherit;background:#fff;color:var(--ink);border:2px solid var(--line);border-radius:14px;padding:10px 12px;min-height:52px;cursor:pointer;min-width:0;width:100%;touch-action:manipulation}
@media (hover:hover){.opt:hover:not([disabled]){border-color:var(--pink);background:var(--pink-soft)}}
.opt .k{flex:0 0 28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--pink-deep);background:var(--pink-soft);font-variant-numeric:tabular-nums}
.opt .body{display:grid;min-width:0;line-height:1.4}
.opt .z{font-family:var(--f-zh);font-size:18px}
.opt .p{font-size:13px;color:var(--muted);font-style:italic}
.opt[disabled]{cursor:default}
.opt.right{background:var(--mint-soft);border-color:var(--mint)}
.opt.right .k{background:var(--mint);color:#fff}
.opt.wrong{background:var(--berry-soft);border-color:var(--berry)}
.opt.wrong .k{background:var(--berry);color:#fff}
.ex{font-size:14.5px;border-top:2px dotted var(--line);padding-top:10px;display:grid;gap:4px}
.verdict{font-weight:700}
.verdict.ok{color:var(--mint)}
.verdict.no{color:var(--berry)}
.empty{color:var(--muted);text-align:center;padding:32px 8px;border:2px dashed var(--line);border-radius:20px;background:var(--card)}
.next{margin-top:18px;width:100%;font:inherit;font-weight:600;min-height:52px;border-radius:999px;border:0;background:var(--pink);color:var(--on-pink);cursor:pointer;box-shadow:0 4px 0 var(--pink-deep)}
.foot{margin-top:24px;color:var(--muted);font-size:12.5px}
.foot a{color:var(--pink-deep)}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);border-radius:20px 20px 0 0;box-shadow:0 -4px 16px rgba(226,61,128,.12)}
.dock .wrap{display:flex;align-items:center;gap:8px;min-height:var(--barh)}
.stat{display:grid;line-height:1.25;flex:1 1 auto;min-width:0}
.stat b{font-size:17px;font-variant-numeric:tabular-nums;color:var(--pink-deep)}
.stat span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dbtn{font:inherit;font-size:14px;font-weight:500;min-height:44px;padding:0 14px;border-radius:999px;border:2px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;white-space:nowrap}
.dbtn.primary{background:var(--pink);border-color:var(--pink);color:var(--on-pink);box-shadow:0 3px 0 var(--pink-deep)}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(74,42,60,.35);display:flex;align-items:flex-end;justify-content:center}
.sheet .card{background:var(--card);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:10px}
.sheet h3{margin:0 0 4px;font-size:18px;color:var(--pink-deep)}
.sheet .row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:14.5px;font-variant-numeric:tabular-nums}
.sheet .row span:nth-child(even){text-align:right;font-weight:700}
.sheet .dbtn{width:100%}
.danger{color:var(--berry)!important}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--barh) + 14px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;font-size:14px;padding:8px 14px;border-radius:999px;z-index:30}

/* mascot pop-up */
.pop{position:fixed;left:0;right:0;bottom:calc(var(--barh) + 10px + env(safe-area-inset-bottom,0px));z-index:15;display:flex;justify-content:center;pointer-events:none}
.pop .bubble{pointer-events:auto;display:flex;align-items:center;gap:10px;background:#fff;border:3px solid var(--pink);border-radius:24px;padding:8px 16px 8px 8px;box-shadow:0 8px 24px rgba(226,61,128,.25);max-width:calc(100% - 32px)}
.pop.sad .bubble{border-color:var(--lav)}
.pop svg.kit{width:92px;height:92px;flex:0 0 92px}
.pop .msg{display:grid;line-height:1.35}
.pop .msg b{font-size:17px;color:var(--pink-deep)}
.pop.sad .msg b{color:#7b5bc4}
.pop .msg span{font-size:13.5px;color:var(--muted)}
.pop .msg .zh{font-family:var(--f-cute);font-size:16px;color:var(--ink)}
.burst{position:fixed;pointer-events:none;z-index:16;font-size:20px;left:50%;bottom:calc(var(--barh) + 80px + env(safe-area-inset-bottom,0px))}
@media (prefers-reduced-motion:no-preference){
  .opt{transition:border-color .15s,background .15s,transform .06s}
  .opt:active:not([disabled]){transform:scale(.98)}
  .pop.show .bubble{animation:popIn .45s cubic-bezier(.2,1.6,.4,1)}
  .pop.happy svg.kit{animation:hop .6s ease-in-out 2}
  .pop.sad svg.kit{animation:sway 1.2s ease-in-out}
  .burst span{position:absolute;animation:fly 1.1s ease-out forwards}
  .sparkles i{animation:twinkle 2.6s ease-in-out infinite}
  header.top svg{animation:hop 2.4s ease-in-out infinite}
}
@keyframes popIn{from{transform:translateY(40px) scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-10px) rotate(-4deg)}70%{transform:translateY(0) rotate(3deg)}}
@keyframes sway{0%,100%{transform:rotate(0)}30%{transform:rotate(-6deg)}60%{transform:rotate(5deg)}}
@keyframes fly{from{transform:translate(0,0) scale(.6);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(1.2) rotate(var(--rot));opacity:0}}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.7)}50%{opacity:.95;transform:scale(1.15)}}
</style>
</head>
<body>
<div class="sparkles" id="sparkles" aria-hidden="true"></div>
<div class="wrap pad">
  <header class="top">
    <span id="headKitty" aria-hidden="true"></span>
    <div class="hgroup">
      <div class="eyebrow">RAM1113 ภาษาและวัฒนธรรมจีน · ชุดที่ 2</div>
      <h1>ข้อสอบเสมือนจริง <span style="white-space:nowrap">加油呀！</span></h1>
      <p class="lede">120 ข้อใหม่ ไม่ซ้ำชุดแรก · มีพินอินทุกข้อ · น้องเหมียวรอเชียร์อยู่</p>
    </div>
  </header>
</div>
<nav class="bar" aria-label="หมวดข้อสอบ">
  <div class="wrap pad">
    <div class="tabs" id="tabs" role="tablist"></div>
    <div class="prog" aria-hidden="true"><i id="prog"></i></div>
    <div class="filters" role="group" aria-label="แสดงข้อ">
      <button class="fbtn" data-f="all" type="button">ทั้งหมด</button>
      <button class="fbtn" data-f="todo" type="button">ยังไม่ทำ</button>
      <button class="fbtn" data-f="wrong" type="button">ข้อที่ผิด</button>
    </div>
  </div>
</nav>
<main class="wrap pad">
  <div class="sechead"><h2 id="secTitle"></h2><p id="secDesc"></p></div>
  <ol class="qs" id="qs"></ol>
  <button class="next" id="nextSec" type="button" hidden></button>
  <p class="foot">เนื้อหาอ้างอิงตำรา RAM1113 ภาษาและวัฒนธรรมจีน บทที่ 1–10 และภาคผนวก · คำตอบเก็บไว้ในเครื่องนี้ · <a href="https://kriangdet-piamchaeng.github.io/ram1113-exam/">ไปทำชุดที่ 1</a></p>
</main>
<div class="pop" id="pop" hidden aria-live="polite"><div class="bubble" id="popBubble"></div></div>
<div class="dock">
  <div class="wrap pad">
    <div class="stat"><b id="secScore">ถูก 0/10</b><span id="allScore">รวม 0/120 · ทำแล้ว 0</span></div>
    <button class="dbtn" id="menuBtn" type="button">เมนู</button>
    <button class="dbtn primary" id="jump" type="button">ข้อถัดไป ↓</button>
  </div>
</div>
<div class="sheet" id="sheet" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <h3 id="sheetTitle">คะแนนของเรา</h3>
    <div class="row" id="summary"></div>
    <button class="dbtn" id="showAll" type="button">ดูเฉลยหมวดนี้ทั้งหมด</button>
    <button class="dbtn danger" id="reset" type="button">ล้างคำตอบหมวดนี้</button>
    <button class="dbtn danger" id="resetAll" type="button">ล้างคำตอบทั้งชุด</button>
    <button class="dbtn primary" id="closeSheet" type="button">ปิด</button>
  </div>
</div>
<script>
const SECTIONS = [
{id:"zh-th", name:"แปลจีน→ไทย", desc:"เลือกความหมายภาษาไทยที่ถูกต้องของคำหรือวลีภาษาจีน", qs:[
 {zh:"请客",py:"qǐng kè",o:["เลี้ยง เป็นเจ้ามือ","เชิญแขกมาที่บ้าน","เป็นแขกของงาน","ทำอาหารให้แขก"],e:"请客 = เลี้ยง เป็นเจ้ามือ (บทที่ 5: 今天我请客。)"},
 {zh:"服务员",py:"fúwùyuán",o:["พนักงานเสิร์ฟ บริกร","ผู้จัดการร้าน","พ่อครัว","เจ้าของร้าน"],e:"服务员 = พนักงานบริการ บริกร (บทที่ 5: 服务员！我们要两碗米饭……)"},
 {zh:"工资",py:"gōngzī",o:["เงินเดือน ค่าจ้าง","ค่าเช่าบ้าน","ราคาสินค้า","เงินทอน"],e:"工资 = ค่าจ้าง เงินเดือน (บทที่ 3: 朋友说那儿的工资也不错)"},
 {zh:"电视剧",py:"diànshìjù",o:["ละครโทรทัศน์","ภาพยนตร์โรง","รายการข่าว","รายการเพลง"],e:"电视剧 = ละครโทรทัศน์ (บทที่ 3: 我喜欢看韩国电视剧)"},
 {zh:"附近",py:"fùjìn",o:["แถวนี้ บริเวณใกล้เคียง","ฝั่งตรงข้าม","ทางแยก","ที่ไกลออกไป"],e:"附近 = บริเวณใกล้ ๆ (บทที่ 9: 这儿附近有纪念品店吗？)"},
 {zh:"改天",py:"gǎitiān",o:["วันหลัง วันอื่น","วันนี้","เมื่อวาน","ทุกวัน"],e:"改天 = วันหลัง ไว้วันอื่น (บทที่ 9: 好，改天我去看看。)"},
 {zh:"照顾",py:"zhàogù",o:["ดูแล","ไปเยี่ยม","ตามหา","ทักทาย"],e:"照顾 = ดูแล (บทที่ 10: 最近我得照顾妹妹)"},
 {zh:"复习",py:"fùxí",o:["ทบทวนบทเรียน","ทำการบ้าน","สอบปลายภาค","เรียนล่วงหน้า"],e:"复习 = ทบทวน, 复习资料 = เอกสารทบทวน (บทที่ 10)"},
 {zh:"刚好",py:"gānghǎo",o:["พอดี","เพิ่งจะ","เกือบจะ","ไม่ค่อย"],e:"刚好 = พอดี (บทที่ 7: 今天我刚好有空。)"},
 {zh:"合适",py:"héshì",o:["เหมาะสม","ราคาถูก","ราคาแพง","สวยงาม"],e:"合适 = เหมาะสม (บทที่ 7: 价格也合适)"}
]},
{id:"th-zh", name:"แปลไทย→จีน", desc:"เลือกคำภาษาจีนที่ตรงกับความหมายภาษาไทย", qs:[
 {th:"คุณย่า (แม่ของพ่อ)",o:["奶奶|nǎinai","外婆|wàipó","爷爷|yéye","姐姐|jiějie"],e:"奶奶 = คุณย่า, 爷爷 = คุณปู่, 外婆 = คุณยาย, 姐姐 = พี่สาว"},
 {th:"ผู้จัดการ",o:["经理|jīnglǐ","警察|jǐngchá","老板|lǎobǎn","服务员|fúwùyuán"],e:"经理 = ผู้จัดการ (บทที่ 3: 我爸爸是经理。)"},

{id:"correct", name:"เลือกประโยคที่ถูก", desc:"เลือกประโยคที่ถูกต้องตามหลักไวยากรณ์", qs:[
 {th:"ข้อใดถูกต้อง",o:["我也很好。|Wǒ yě hěn hǎo.","也我很好。|Yě wǒ hěn hǎo.","我很也好。|Wǒ hěn yě hǎo.","我很好也。|Wǒ hěn hǎo yě."],e:"也 วางหลังประธาน หน้าภาคแสดง"},
 {th:"ข้อใดถูกต้อง",o:["这是我的汉语老师。|Zhè shì wǒ de Hànyǔ lǎoshī.","这是我汉语的老师。|Zhè shì wǒ Hànyǔ de lǎoshī.","我的这是汉语老师。|Wǒ de zhè shì Hànyǔ lǎoshī.","这是老师我的汉语。|Zhè shì lǎoshī wǒ de Hànyǔ."],e:"ส่วนขยายอยู่หน้าคำนามเสมอ: 我的 + 汉语老师"},
 {th:"ข้อใดถูกต้อง",o:["他在一家外贸公司工作。|Tā zài yì jiā wàimào gōngsī gōngzuò.","他工作在一家外贸公司。|Tā gōngzuò zài yì jiā wàimào gōngsī.","他在一所外贸公司工作。|Tā zài yì suǒ wàimào gōngsī gōngzuò.","他一家在外贸公司工作。|Tā yì jiā zài wàimào gōngsī gōngzuò."],e:"在 + สถานที่ วางหน้ากริยา และบริษัทใช้ลักษณนาม 家"},
 {th:"ข้อใดถูกต้อง",o:["我没有哥哥。|Wǒ méiyǒu gēge.","我不有哥哥。|Wǒ bù yǒu gēge.","我有没哥哥。|Wǒ yǒu méi gēge.","我没哥哥有。|Wǒ méi gēge yǒu."],e:"ปฏิเสธ 有 ต้องใช้ 没有 เสมอ ไม่ใช้ 不有"},
 {th:"ข้อใดถูกต้อง",o:["你吃过北京烤鸭吗？|Nǐ chī guo Běijīng kǎoyā ma?","你过吃北京烤鸭吗？|Nǐ guo chī Běijīng kǎoyā ma?","你吃北京烤鸭过吗？|Nǐ chī Běijīng kǎoyā guo ma?","你吃了过北京烤鸭吗？|Nǐ chī le guo Běijīng kǎoyā ma?"],e:"过 ติดหลังกริยาทันที: 吃过"},
 {th:"ข้อใดถูกต้อง",o:["我会说汉语。|Wǒ huì shuō Hànyǔ.","我说会汉语。|Wǒ shuō huì Hànyǔ.","我会汉语说。|Wǒ huì Hànyǔ shuō.","会我说汉语。|Huì wǒ shuō Hànyǔ."],e:"กริยาช่วย 会 วางหน้ากริยาหลัก"},
 {th:"ข้อใดถูกต้อง",o:["学校离我家很远。|Xuéxiào lí wǒ jiā hěn yuǎn.","学校从我家很远。|Xuéxiào cóng wǒ jiā hěn yuǎn.","离学校我家很远。|Lí xuéxiào wǒ jiā hěn yuǎn.","学校离很远我家。|Xuéxiào lí hěn yuǎn wǒ jiā."],e:"บอกระยะห่างใช้ A + 离 + B + 远/近 ไม่ใช้ 从"},
 {th:"ข้อใดถูกต้อง",o:["你记得给她打电话。|Nǐ jìde gěi tā dǎ diànhuà.","你给她记得打电话。|Nǐ gěi tā jìde dǎ diànhuà.","记得你给她打电话。|Jìde nǐ gěi tā dǎ diànhuà.","你给她打电话记得。|Nǐ gěi tā dǎ diànhuà jìde."],e:"记得 + เรื่องที่ต้องทำ = อย่าลืม… (ใช้เตือน)"},
 {th:"ข้อใดถูกต้อง",o:["小赵是去年结婚的。|Xiǎo Zhào shì qùnián jiéhūn de.","小赵去年是结婚的。|Xiǎo Zhào qùnián shì jiéhūn de.","是小赵去年结婚。|Shì Xiǎo Zhào qùnián jiéhūn.","小赵是结婚去年的。|Xiǎo Zhào shì jiéhūn qùnián de."],e:"是 วางหน้าส่วนที่ต้องการเน้น (去年) และ 的 อยู่ท้าย"},
 {th:"ข้อใดถูกต้อง",o:["我们先做完作业，再去看。|Wǒmen xiān zuò wán zuòyè, zài qù kàn.","我们再做完作业，先去看。|Wǒmen zài zuò wán zuòyè, xiān qù kàn.","先我们做完作业，再我们去看。|Xiān wǒmen zuò wán zuòyè, zài wǒmen qù kàn.","我们做完先作业，去看再。|Wǒmen zuò wán xiān zuòyè, qù kàn zài."],e:"先 + กริยา (ก่อน), 再 + กริยา (แล้วค่อย) วางหลังประธาน"}

{id:"fill", name:"เติมคำ", desc:"เลือกคำที่เหมาะสมเติมในช่องว่าง", qs:[

 {zh:"李老师：你家有几口人？有____呢？",py:"Lǐ lǎoshī: Nǐ jiā yǒu jǐ kǒu rén? Yǒu ____ ne?",o:["谁|shéi","几|jǐ","什么|shénme","哪儿|nǎr"],e:"ถามว่ามีใครบ้าง ใช้ 谁"},
 {zh:"甘：“妈妈的爸爸”中文____说？",py:"Gān: “Māma de bàba” Zhōngwén ____ shuō?",o:["怎么|zěnme","什么|shénme","哪儿|nǎr","几|jǐ"],e:"怎么 + กริยา = …อย่างไร"},
 {zh:"林美英：你哥哥结婚了吗？对不起，____问吗？",py:"Lín Měiyīng: Nǐ gēge jiéhūn le ma? Duìbuqǐ, ____ wèn ma?",o:["可以|kěyǐ","会|huì","得|děi","过|guo"],e:"可以 = ได้ (ขออนุญาต)"},
 {zh:"林美英：我和你是好朋友____，不用客气了。",py:"Lín Měiyīng: Wǒ hé nǐ shì hǎo péngyou ____, búyòng kèqi le.",o:["嘛|ma","吗|ma","呢|ne","的|de"],e:"嘛 แสดงน้ำเสียงว่าเป็นเรื่องที่ชัดเจนอยู่แล้ว (ก็…นี่นา)"},
 {zh:"甘：天气____热，你喝点儿吧。",py:"Gān: Tiānqì ____ rè, nǐ hē diǎnr ba.",o:["这么|zhème","什么|shénme","怎么|zěnme","多少|duōshao"],e:"这么 + คุณศัพท์ = …ขนาดนี้"},
 {zh:"张老师：我吃饱了，您____吃。",py:"Zhāng lǎoshī: Wǒ chī bǎo le, nín ____ chī.",o:["慢慢|mànmàn","快快|kuàikuài","常常|chángcháng","刚刚|gānggāng"],e:"您慢慢吃 = เชิญทานตามสบาย เป็นคำสุภาพเมื่อลุกก่อน"},
 {zh:"方校长：你再加____饭吧。",py:"Fāng xiàozhǎng: Nǐ zài jiā ____ fàn ba.",o:["点儿|diǎnr","一下|yíxià","有点儿|yǒudiǎnr","个|ge"],e:"กริยา + (一)点儿 + คำนาม = …อีกหน่อย"},
 {zh:"售货员：你们还要____的吗？",py:"Shòuhuòyuán: Nǐmen hái yào ____ de ma?",o:["别|bié","什么|shénme","哪|nǎ","好|hǎo"],e:"别的 = อย่างอื่น"},
 {zh:"售货员：一共十四____五。",py:"Shòuhuòyuán: Yígòng shísì ____ wǔ.",o:["块|kuài","斤|jīn","个|ge","分|fēn"],e:"十四块五 = 14.50 หยวน (块 คือหน่วยเงินในภาษาพูด)"},
 {zh:"白小虹：这件不大____不小。我要这件。",py:"Bái Xiǎohóng: Zhè jiàn bú dà ____ bù xiǎo. Wǒ yào zhè jiàn.",o:["也|yě","都|dōu","还|hái","就|jiù"],e:"不……也不…… = ไม่…และก็ไม่… (พอดี)"},
 {zh:"美女，不要走____那么快！",py:"Měinǚ, búyào zǒu ____ nàme kuài!",o:["得|de","的|de","了|le","过|guo"],e:"กริยา + 得 + ส่วนเสริมบอกระดับ"},
 {zh:"漂亮____漂亮，但是我们中国人不送伞。",py:"Piàoliang ____ piàoliang, dànshì wǒmen Zhōngguó rén bú sòng sǎn.",o:["是|shì","很|hěn","也|yě","都|dōu"],e:"A 是 A，但是…… = …ก็จริงอยู่ แต่…"},
 {zh:"李老师：他的女儿____一岁，对吗？",py:"Lǐ lǎoshī: Tā de nǚ'ér ____ yí suì, duì ma?",o:["刚|gāng","都|dōu","也|yě","还是|háishi"],e:"刚 = เพิ่งจะ"},
 {zh:"张老师：我觉得那一只____可爱。",py:"Zhāng lǎoshī: Wǒ juéde nà yì zhī ____ kě'ài.",o:["更|gèng","都|dōu","还是|háishi","一点儿|yìdiǎnr"],e:"更 = ยิ่งกว่า มากกว่า (เปรียบเทียบ)"},
 {zh:"何洁：我常常去图书馆看书，____上网玩游戏。",py:"Hé Jié: Wǒ chángcháng qù túshūguǎn kàn shū, ____ shàng wǎng wán yóuxì.",o:["或者|huòzhě","还是|háishi","因为|yīnwèi","所以|suǒyǐ"],e:"ประโยคบอกเล่าที่ให้เลือก ใช้ 或者 = หรือ"},
 {zh:"何洁：美英告诉____我，你唱歌唱得很好听。",py:"Hé Jié: Měiyīng gàosu ____ wǒ, nǐ chàng gē chàng de hěn hǎotīng.",o:["过|guo","得|de","在|zài","着|zhe"],e:"กริยา + 过 = เคย… (เคยบอก)"},
 {zh:"何洁：好啊，人多____好玩。",py:"Hé Jié: Hǎo a, rén duō ____ hǎowán.",o:["才|cái","就|jiù","也|yě","都|dōu"],e:"才 = ถึงจะ… (คนเยอะถึงจะสนุก)"},
 {zh:"甘：等你有空，能不能____我打麻将？",py:"Gān: Děng nǐ yǒu kòng, néng bu néng ____ wǒ dǎ májiàng?",o:["教|jiāo","学|xué","跟|gēn","给|gěi"],e:"教 + คน + สิ่งที่สอน = สอน…ให้…"},
 {zh:"往东一直走三百____，电脑店就在地铁站旁边。",py:"Wǎng dōng yìzhí zǒu sānbǎi ____, diànnǎo diàn jiù zài dìtiě zhàn pángbiān.",o:["米|mǐ","斤|jīn","块|kuài","口|kǒu"],e:"米 = เมตร"},
 {zh:"白小虹：从我家往西走，到十字路口____再往北走。",py:"Bái Xiǎohóng: Cóng wǒ jiā wǎng xī zǒu, dào shízì lùkǒu ____ zài wǎng běi zǒu.",o:["以后|yǐhòu","以前|yǐqián","时候|shíhou","旁边|pángbiān"],e:"……以后 = หลังจาก…"},
 {zh:"甘：好啊，你____微信把地址发给我。",py:"Gān: Hǎo a, nǐ ____ wēixìn bǎ dìzhǐ fā gěi wǒ.",o:["用|yòng","在|zài","给|gěi","跟|gēn"],e:"用 + เครื่องมือ = ใช้…(ทำ…)"},
 {zh:"如果以后你再来北京____，一定要来找我哦！",py:"Rúguǒ yǐhòu nǐ zài lái Běijīng ____, yídìng yào lái zhǎo wǒ o!",o:["的话|dehuà","以后|yǐhòu","时候|shíhou","所以|suǒyǐ"],e:"如果……的话 = ถ้าหาก…"}
]},
{id:"culture", name:"วัฒนธรรม", desc:"ความรู้ด้านวัฒนธรรมจีนจากหัวข้อ 文化知识 (wénhuà zhīshi) ทั้ง 10 บท", qs:[
 {th:"ทักทายอาจารย์แซ่ติงในตอนเช้า ข้อใดเหมาะสมที่สุด",o:["丁老师，早上好！|Dīng lǎoshī, zǎoshang hǎo!","老师丁，早上好！|Lǎoshī Dīng, zǎoshang hǎo!","丁老师，晚上好！|Dīng lǎoshī, wǎnshang hǎo!","丁，拜拜！|Dīng, bàibài!"],e:"แซ่ + 老师 แล้วตามด้วย 早上好 สำหรับตอนเช้า"},
 {th:"บอกลาผู้อาวุโสว่า “พบกันพรุ่งนี้” ข้อใดถูก",o:["明天见！|Míngtiān jiàn!","下次见！|Xiàcì jiàn!","晚上好！|Wǎnshang hǎo!","您好！|Nín hǎo!"],e:"明天见 = พบกันพรุ่งนี้, 下次见 = พบกันครั้งหน้า"},
 {th:"คำว่า 告辞 (gàocí) หมายถึงข้อใด",o:["กล่าวลา","พบหน้า","ทักทาย","แนะนำตัว"],e:"见面 = พบหน้า, 告辞 = กล่าวลา (บทที่ 1)"},
 {th:"ถามไถ่อย่างเป็นกันเองว่า “จะไปไหนเหรอ” ข้อใดถูก",o:["你上哪儿呢？|Nǐ shàng nǎr ne?","你是哪里人？|Nǐ shì nǎlǐ rén?","你在哪儿工作？|Nǐ zài nǎr gōngzuò?","你家在哪儿？|Nǐ jiā zài nǎr?"],e:"上哪儿 = ไปไหน ชาวจีนไม่ถือว่าเป็นการละลาบละล้วง"},
 {th:"ตามตำรา การไหว้ของไทยแบ่งเป็นกี่ระดับ",o:["3 ระดับ","2 ระดับ","4 ระดับ","5 ระดับ"],e:"ไหว้พระ ไหว้ผู้ใหญ่ และไหว้ระดับเดียวกันหรือรับไหว้"},
 {th:"เมื่อทำความรู้จักกัน ชาวจีนมักทำอย่างไร",o:["แนะนำตัวเองก่อน แล้วค่อยถามแซ่และชื่อของคู่สนทนา","ถามชื่อคู่สนทนาก่อนทุกครั้ง","ถามอายุก่อนแนะนำตัว","ให้ผู้อาวุโสแนะนำตัวก่อน"],e:"คนจีนมักแนะนำตัวเองก่อน และมักถามแซ่ก่อนชื่อ"},
 {th:"“Mrs. Chen” ภาษาจีนเรียกว่าอย่างไร",o:["陈女士|Chén nǚshì","陈小姐|Chén xiǎojiě","陈先生|Chén xiānsheng","女士陈|Nǚshì Chén"],e:"แซ่ + 女士 = Mrs./Ms., 小姐 = Miss, 先生 = Mr."},
 {th:"ข้อใดถูกต้องเรื่องมารยาทการเรียกขานของชาวจีน",o:["ไม่เรียกชื่อผู้อาวุโสถ้าไม่จำเป็น มักเรียกแซ่ตามด้วยคำเรียกขาน","เรียกชื่อเล่นของผู้อาวุโสได้เลย","เรียกคำเรียกขานก่อนแล้วตามด้วยแซ่","เรียกเฉพาะชื่อโดยไม่ต้องมีแซ่"],e:"เช่น 张老师 陈先生 โดยมารยาทไม่เรียกชื่อผู้อาวุโส"},
 {th:"เมื่อผู้อาวุโสพูดว่า 认识您很高兴 (Rènshi nín hěn gāoxìng) ควรตอบว่าอย่างไร",o:["认识您，我也很高兴。|Rènshi nín, wǒ yě hěn gāoxìng.","不客气。|Bú kèqi.","没关系。|Méi guānxi.","您贵姓？|Nín guìxìng?"],e:"ตอบว่าได้รู้จักคุณ ฉันก็ดีใจเช่นกัน"},
 {th:"ถามว่า “บ้านเกิดของคุณอยู่ที่ไหน” ข้อใดถูก",o:["你老家在哪儿？|Nǐ lǎojiā zài nǎr?","你在哪儿学习？|Nǐ zài nǎr xuéxí?","你跟谁住在一起？|Nǐ gēn shéi zhù zài yìqǐ?","你上哪儿呢？|Nǐ shàng nǎr ne?"],e:"老家 = บ้านเกิด"},
 {th:"คำย่อ 超市 (chāoshì) ย่อมาจากคำใด",o:["超级市场|chāojí shìchǎng","超级商场|chāojí shāngchǎng","市场超级|shìchǎng chāojí","超大市区|chāodà shìqū"],e:"超级市场 = ซูเปอร์มาร์เก็ต ย่อเป็น 超市"},
 {th:"“ธุรกิจออนไลน์” ตามตำราบทที่ 3 ภาษาจีนคือข้อใด",o:["在线业务|zàixiàn yèwù","网上购物|wǎngshàng gòuwù","外卖|wàimài","快递|kuàidì"],e:"在线业务 = ธุรกิจออนไลน์, 网上购物 = ซื้อของออนไลน์"},
 {th:"คุณอาชาย (น้องชายของพ่อ) ภาษาจีนเรียกว่าอะไร",o:["叔父|shūfù","伯父|bófù","舅舅|jiùjiu","外公|wàigōng"],e:"伯父 = พี่ชายพ่อ, 叔父 = น้องชายพ่อ"},
 {th:"พี่ชายหรือน้องชายของแม่ ภาษาจีนเรียกว่าอะไร",o:["舅舅|jiùjiu","叔父|shūfù","伯父|bófù","姑姑|gūgu"],e:"舅舅/舅父 ใช้เรียกทั้งพี่ชายและน้องชายของแม่"},
 {th:"เรียกคุณลุงแซ่หลินที่ไม่ใช่ญาติอย่างให้เกียรติ ข้อใดถูก",o:["林伯伯|Lín bóbo","林舅舅|Lín jiùjiu","伯父林|bófù Lín","林先生们|Lín xiānshengmen"],e:"คนที่ไม่ใช่ญาติ มักเรียกแบบญาติโดยนำด้วยแซ่ เช่น 林伯伯 หรือ 阿伯"},
 {th:"เจ้าของบ้านต้อนรับแขกตามธรรมเนียม ควรพูดว่าอะไร",o:["请坐。先喝茶吧！|Qǐng zuò. Xiān hē chá ba!","你怎么来了？|Nǐ zěnme lái le?","我不方便。|Wǒ bù fāngbiàn.","你快走吧！|Nǐ kuài zǒu ba!"],e:"เชิญนั่งและดื่มชาก่อน เป็นการต้อนรับขับสู้"},
 {th:"เมื่อรับประทานอาหารกับผู้ใหญ่ ควรนั่งเมื่อใด",o:["รอให้ผู้ใหญ่เข้าที่นั่งก่อน","นั่งก่อนเพื่อจองที่","นั่งพร้อมกันทุกคน","นั่งเมื่ออาหารมาถึง"],e:"มารยาทจีนและไทยคล้ายกัน คือให้เกียรติผู้อาวุโส"},
 {th:"การตักอาหารครั้งแรกบนโต๊ะที่มีผู้ใหญ่ ควรทำอย่างไร",o:["ให้ผู้ใหญ่ตักก่อน แล้วจึงตัก","ตักอาหารที่ชอบให้หมดจานก่อน","ตักให้ตัวเองก่อนแล้วตักให้ผู้ใหญ่","ใครหิวก็ตักก่อนได้"],e:"ให้เกียรติผู้ใหญ่ และไม่ควรตักจนหมดจาน ควรเผื่อแผ่ผู้อื่น"},
 {th:"ชวนเพื่อนไปกินข้าวโดยยังไม่ได้ตกลงว่าใครเลี้ยง ควรพูดว่าอย่างไร",o:["我们一起去吃饭，怎么样？|Wǒmen yìqǐ qù chī fàn, zěnmeyàng?","我请客。|Wǒ qǐng kè.","你请客吧。|Nǐ qǐng kè ba.","我买单。|Wǒ mǎidān."],e:"ถ้าพูด 我请客 จะหมายถึงเราเป็นเจ้ามือ"},
 {th:"ถ้าทำตะเกียบตกพื้นโดยไม่ตั้งใจ ควรทำอย่างไร",o:["รีบเก็บขึ้นและกล่าวขอโทษ","ปล่อยไว้แล้วขอตะเกียบใหม่","ใช้ตะเกียบนั้นต่อเลย","หัวเราะกลบเกลื่อน"],e:"ตำราระบุว่าต้องรีบเก็บขึ้นและขอโทษ หรืออาจกล่าวคำมงคล"},
 {th:"ข้อใด “เป็นข้อห้าม” ในการใช้ตะเกียบของจีน",o:["ใช้ตะเกียบเคาะชามข้าวหรือเคาะโต๊ะ","ใช้ตะเกียบกลางคีบอาหารจากจานรวม","วางตะเกียบเสมอกันข้างชามเมื่ออิ่ม","ใช้ตะเกียบพุ้ยข้าวในชาม"],e:"ห้ามเคาะโต๊ะ เคาะชาม ชี้หน้า ปักบนชาม วางไขว้ และเขี่ยอาหาร"},
 {th:"หน่วย 一斤 (yì jīn) ของไต้หวัน เท่ากับกี่กรัม",o:["600 กรัม","500 กรัม","1,000 กรัม","400 กรัม"],e:"จีนแผ่นดินใหญ่ 1 斤 = 500 กรัม ไต้หวัน 1 斤 = 600 กรัม"},
 {th:"เงิน “บาท” ของไทย ภาษาจีนเรียกว่าอะไร",o:["泰铢|tàizhū","元|yuán","毛|máo","分|fēn"],e:"泰铢 = บาท, 士丁 (shìdīng) = สตางค์ โดย 100 สตางค์ = 1 บาท"},
 {th:"คำว่า 帅哥 (shuàigē) ที่แม่ค้าใช้ หมายถึงข้อใด",o:["หนุ่มหล่อ ใช้เรียกลูกค้าผู้ชาย","เถ้าแก่ร้าน","พี่ชายแท้ ๆ","ลูกค้าประจำ"],e:"美女 = สาวสวย, 帅哥 = หนุ่มหล่อ ใช้เรียกลูกค้าเพื่อสร้างบรรยากาศดี"},
 {th:"ขอชิมผลไม้ก่อนซื้อ ข้อใดพูดถูก",o:["老板，可以试吃吗？|Lǎobǎn, kěyǐ shì chī ma?","老板，可以试穿吗？|Lǎobǎn, kěyǐ shì chuān ma?","老板，一共多少钱？|Lǎobǎn, yígòng duōshao qián?","老板，太贵了！|Lǎobǎn, tài guì le!"],e:"试吃 = ลองชิม, 试穿 = ลองสวม"},
 {th:"ตามตำรา เสื้อผ้าแบบใดที่ร้านมักไม่ให้ลองสวม",o:["贴身衣服|tiēshēn yīfu ชุดแนบเนื้อ","外套|wàitào เสื้อคลุม","衬衫|chènshān เสื้อเชิ้ต","裤子|kùzi กางเกง"],e:"不可以，贴身衣服不可以试穿的。"},

function stemHTML(s,q){

  if(q.zh) return `<div>${s.id==="fill"?"เลือกคำเติมในช่องว่าง":s.id==="sent"?"ประโยคนี้แปลว่าอะไร":"คำนี้แปลว่าอะไร"}</div><div class="zhline">${esc(q.zh)}</div><div class="pyline">${esc(q.py)}</div>`;

function qHTML(s,q,qi){
  const n=offsets[cur]+qi+1, key=keyOf(s,qi), picked=answers[key], done=picked!==undefined;
  const opts=q.order.map((oi,pos)=>{
    let cls="opt"; if(done){if(pos===q.correct)cls+=" right";else if(pos===picked)cls+=" wrong"}
    return `<button class="${cls}" type="button" data-k="${key}" data-pos="${pos}" ${done?"disabled":""}><span class="k">${pos+1}</span>${optHTML(q.o[oi])}</button>`;
  }).join("");
  let ex="";
  if(done){
    const verdict=picked===-1?`<span class="verdict ok">เฉลย ข้อ ${q.correct+1}</span>`:picked===q.correct?`<span class="verdict ok">ถูกต้อง ♡ ข้อ ${q.correct+1}</span>`:`<span class="verdict no">ยังไม่ถูก · เฉลยข้อ ${q.correct+1}</span>`;
    const full=q.ans?(()=>{const[z,p]=q.ans.split("|");return `<div class="zhline">${esc(z)}</div><div class="pyline">${esc(p)}</div>`})():"";
    ex=`<div class="ex">${verdict}${full}<div>${esc(q.e)}</div></div>`;
  }
  return `<li class="q" id="q-${key}"><div class="qtop"><span class="qn">${n}</span><div class="qtext">${stemHTML(s,q)}</div></div><div class="opts">${opts}</div>${ex}</li>`;

  const s=SECTIONS[cur]; const sd=s.qs.filter((q,qi)=>answers[keyOf(s,qi)]!==undefined).length;
  $("secScore").textContent=`ถูก ${sc}/${s.qs.length}`;
  $("allScore").textContent=`รวมทั้งชุด ถูก ${tot}/${TOTAL} · ทำแล้ว ${done}`;
  $("prog").style.width=(sd/s.qs.length*100)+"%";
}
$("jump").onclick=()=>{
  const s=SECTIONS[cur]; const qi=s.qs.findIndex((q,i)=>answers[keyOf(s,i)]===undefined);
  if(qi<0){ if(cur<SECTIONS.length-1){toast("หมวดนี้ทำครบแล้ว ไปหมวดถัดไป");go(cur+1)} else toast("ทำครบทุกข้อแล้ว เก่งที่สุด ♡"); return }
  if(filter==="wrong"){filter="all";render()}
  const el=$("q-"+keyOf(s,qi)); if(el) el.scrollIntoView({behavior:"smooth",block:"start"});
};
document.querySelectorAll(".fbtn").forEach(b=>b.onclick=()=>{filter=b.dataset.f;render()});
function resetLabels(){$("reset").textContent="ล้างคำตอบหมวดนี้";$("resetAll").textContent="ล้างคำตอบทั้งชุด"}
$("menuBtn").onclick=()=>{
  let rows="";
  SECTIONS.forEach(s=>{let c=0;s.qs.forEach((q,qi)=>{const a=answers[keyOf(s,qi)];if(a!==undefined&&a!==-1&&a===q.correct)c++});rows+=`<span>${s.name}</span><span>${c}/${s.qs.length}</span>`});
  $("summary").innerHTML=rows; confirmArm=null; resetLabels(); $("sheet").hidden=false;
};
$("closeSheet").onclick=()=>$("sheet").hidden=true;
$("sheet").onclick=e=>{if(e.target.id==="sheet")$("sheet").hidden=true};
$("showAll").onclick=()=>{const s=SECTIONS[cur];s.qs.forEach((q,qi)=>{const k=keyOf(s,qi);if(answers[k]===undefined)answers[k]=-1});save();$("sheet").hidden=true;render()};
$("reset").onclick=()=>{ if(confirmArm!=="sec"){confirmArm="sec";resetLabels();$("reset").textContent="แตะอีกครั้งเพื่อยืนยัน";return}
  const s=SECTIONS[cur];s.qs.forEach((q,qi)=>delete answers[keyOf(s,qi)]);save();$("sheet").hidden=true;render();window.scrollTo({top:0});toast("ล้างคำตอบหมวดนี้แล้ว")};
$("resetAll").onclick=()=>{ if(confirmArm!=="all"){confirmArm="all";resetLabels();$("resetAll").textContent="แตะอีกครั้งเพื่อยืนยัน";return}
  answers={};save();$("sheet").hidden=true;go(0);toast("ล้างคำตอบทั้งชุดแล้ว")};
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("sheet").hidden=true});
render();
</script>
</body>
</html>
